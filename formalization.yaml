# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "EC-SBM synthetic network generator: its edge-connectivity guarantees"
  description: >-
    A Lean 4 and Mathlib formalization of the two theorems of Vu-Le, Anne, Chacko and Warnow,
    "EC-SBM synthetic network generator" (Applied Network Science 10, 15, 2025). EC-SBM generates
    a synthetic network that resembles a given clustered network. Its first step builds, for each
    cluster whose minimum edge cut has k edges, a spanning subnetwork: it starts from a
    (k+1)-clique and adds the other vertices one at a time, each made adjacent to exactly k
    vertices already present. Later steps add edges generated by a stochastic block model, remove
    self-loops and parallel edges, and add edges to fit the degree sequence.


    Theorem 1: the spanning subnetwork is k-edge-connected, whatever k-edge-connected graph the
    procedure starts from. Theorem 2: every cluster of the network that EC-SBM returns has a
    minimum edge cut at least as large as in the input network, whatever the later steps add. Both
    are proved by the paper's arguments, with the paper's unnumbered claims about the procedure,
    and the Challenge compares the paper's minimum cut size with Mathlib's k-edge-connectivity.
    Theorem 1's argument is the edge version of the known expansion lemma, applied once per added
    vertex; the paper's contribution is a generator that obtains the guarantee of Theorem 2 by
    construction, with a proof.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: [math.CO, cs.SI, cs.DM]
  msc2020: [05C40, 05C82, 05C85, 68R10]

sources:
  - title: "EC-SBM synthetic network generator"
    authors:
      - "The-Anh Vu-Le"
      - "Lahari Anne"
      - "George Chacko"
      - "Tandy Warnow"
    id: "doi:10.1007/s41109-025-00701-2"
    type: paper
    location: "Applied Network Science 10, 15 (2025), https://doi.org/10.1007/s41109-025-00701-2"
    relationship: formalizes
    note: >-
      The published version (version of record, 1 May 2025) is formalized: Theorems 1 and 2 of
      Section "Theoretical guarantees", and the paper's unnumbered claims about Step 1 of Stage 1.
      The formalization was made at the request of The-Anh Vu-Le, the paper's first author; the
      other authors were not contacted.
    license: "CC BY 4.0"
    author_endorsement: other
  - title: "EC-SBM Synthetic Network Generator (arXiv version)"
    authors:
      - "The-Anh Vu-Le"
      - "Lahari Anne"
      - "George Chacko"
      - "Tandy Warnow"
    id: "arXiv:2502.03662v1"
    type: paper
    location: "https://arxiv.org/abs/2502.03662v1"
    relationship: background
    note: >-
      The earlier version, which proves Theorem 1 only for a (k+1)-clique as initial graph. Its
      counting argument proves that the (k+1)-clique is k-edge-connected, which the published
      version uses without proof; the formalization proves that fact by this argument.

  - title: "Edge connectivity in graphs: an expansion theorem"
    authors:
      - "José Ignacio Alvarez-Hamelin"
      - "Jorge Rodolfo Busch"
    id: "arXiv:0803.3057"
    type: paper
    location: "https://arxiv.org/abs/0803.3057"
    relationship: background
    note: >-
      Not cited by the paper. Its expansion theorem contains the edge version of the expansion
      lemma (adding a vertex with at least k edges to a k-edge-connected graph keeps it
      k-edge-connected), from which Theorem 1 follows by induction on the added vertices. The
      formalization follows the paper's own proof, and did not use this work.

related_formalizations: []

status:
  scope: >-
    Formalized: Theorems 1 and 2 of the paper, by its proofs, and its unnumbered claims about
    Step 1 of Stage 1 (the first k+1 vertices form a clique; the spanning subnetwork is
    k-edge-connected; Theorem 2 for the procedure the paper runs; every edge lies in exactly one
    of the clustered and outlier subnetworks). The formalization is unconditional: the paper's
    proofs cite no result. EC-SBM is modelled by what the proof of Theorem 2 uses: Step 1 exactly,
    with arbitrary choices of order and neighbours, and the stochastic block model samples and the
    degree-correction edges as arbitrary multigraphs and edges; the parameter updates, the rules
    of the stochastic block model and of degree correction are not modelled, since the guarantee
    holds whatever they produce. Not formalized: the experiments and statistics of the paper.
    Theorem 2 states as a hypothesis that Step 1 starts from k-edge-connected graphs, which the
    paper's phrase "allowing for any way of initializing Step 1" leaves to the text before
    Theorem 1. The misprint max{k,|N0|} in the description of Step 1 is read as min{k,|N0|}.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["Claude Opus 5.5 (claude-opus-5-5)"]
      framework: "Claude Code 2.1.291 (VS Code extension)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, commit
        d82a98e1237e5b864bb76185b1ebb5548092a184, version 2.2.0), run by one main session with
        sub-agents for the statement review, the proof comparison, the literature search and the
        audit verification; see CREDITS.md.
      cost:
        wall_time: "1.55 hours elapsed to the completed audit report, with 1.3 hours of sub-agent working time (4 sub-agents, at most 2 at once); see CREDITS.md"
        spend_usd: "not tracked"
        hardware: "local machine (20 cores, 62 GB RAM)"
      prompting_notes: >-
        One request: the skill's command with the paper's DOI link. The agent chose the published
        version, wrote the statements, had them reviewed, proved them, and wrote the audit.
  spend_usd: "not tracked"
  notes: >-
    Every statement, proof and document was written by the AI system; independent sub-agents
    reviewed the statements against the paper (twice), compared the proofs with the paper's, and
    checked the audit's findings. No person has reviewed the proofs. CREDITS.md gives the details.

fidelity:
  divergences: >-
    Statements: none changed. Readings: (1) "max{k,|N0|}" in the description of Step 1 (Section
    "The EC-SBM network simulator") is a misprint for min{k,|N0|}; (2) Theorem 1 uses the rule
    of Section "Theoretical guarantees", each added vertex made adjacent to exactly k vertices
    already present; (3) Theorem 2's "allowing for any way of initializing Step 1" means any
    k-edge-connected initialization, as the paragraph before Theorem 1 says, and is stated as a
    hypothesis; (4) the minimum cut size of a graph with at most one vertex, which has no edge
    cut, is infinity (the paper leaves it undefined); (5) the outliers are the vertices of
    singleton clusters, as in Section "Terminology". Proofs: every proof follows the paper's; no
    departure. The standard fact that the (k+1)-clique is k-edge-connected, which the published
    version uses without proof, is proved by the counting argument of the arXiv version.

review:
  status: agent-reviewed
  reviewers:
    - "Claude Opus 5.5 sub-agents (statement review, proof comparison, audit verification)"
  notes: >-
    The statements and the Challenge were reviewed against the published text by a separate
    agent, twice; the formal proofs were compared with the paper's by another; the findings of
    REPORT.md were checked against the text by another. No human review yet.

alignment:
  namespace: "ECSBM.Challenge"
  statements:
    - source: "Theorem 1 (Section \"Theoretical guarantees\")"
      lean: "ECSBM.Challenge.theorem1"
      module: "Challenge"
      status: "proved"
      note: >-
        A run of Step 1 started from any k-edge-connected graph N0 outputs a k-edge-connected
        graph on the cluster's vertices. Each added vertex is made adjacent to exactly k vertices
        already present, in any order and with any choice of neighbours.
    - source: "Theorem 2 (Section \"Theoretical guarantees\")"
      lean: "ECSBM.Challenge.theorem2"
      module: "Challenge"
      status: "proved"
      note: >-
        For every run of EC-SBM whose Step 1 starts, in each non-singleton cluster, from a
        k-edge-connected graph (k the cluster's minimum cut size in the input), every cluster's
        minimum cut size in the output is at least its minimum cut size in the input. The
        stochastic block model samples and degree-correction edges are arbitrary.
    - source: "Section \"Terminology\": the minimum cut size and k-edge-connectivity"
      lean: "ECSBM.Challenge.le_minCutSize_iff"
      module: "Challenge"
      status: "proved"
      note: "The paper's minimum cut size is at least k exactly for Mathlib's k-edge-connected graphs."
    - source: "Section \"Terminology\": disconnected clusters"
      lean: "ECSBM.Challenge.minCutSize_eq_zero_iff"
      module: "Challenge"
      status: "proved"
      note: "A check of the definition: the minimum cut size is 0 exactly for disconnected graphs."
    - source: "Section \"Terminology\": the minimum cut size"
      lean: "ECSBM.Challenge.minCutSize_completeGraph"
      module: "Challenge"
      status: "proved"
      note: "A check of the definition: the complete graph on n+2 vertices has minimum cut size n+1."
    - source: "Section \"The EC-SBM network simulator\": Step 1 starts from a (k+1)-clique"
      lean: "ECSBM.Challenge.Run.exists_clique"
      module: "Challenge"
      status: "proved"
      note: >-
        Runs of EC-SBM with Step 1 started from (k+1)-cliques exist for every clustered network
        and meet the hypothesis of Theorem 2, which is therefore not vacuous.

acknowledgements: >-
